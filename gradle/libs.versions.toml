[versions]
agp = "9.2.0"
kotlin = "2.3.20"
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
# Real org.json for unit tests. The android.jar on the unit-test classpath ships a STUB whose
# methods throw (or, with returnDefaultValues, silently return null) — see testOptions in
# app/build.gradle.kts. Without this, no JSON parser in the app can be unit-tested at all.
orgJson = "20250107"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.9.3"
activityCompose = "1.11.0"
composeBom = "2026.06.00"
navigationCompose = "2.9.4"
lifecycleViewmodelCompose = "2.9.3"
okhttp = "5.4.0"
material3 = "1.5.0-alpha19"
baselineprofile = "1.5.0-alpha06"
materialKolor = "4.1.1"
# detekt 2.0.x is the line built for Kotlin 2.3+/AGP 9/Gradle 9 (stable 1.23.x targets Kotlin 2.0.21).
# compose-rules' detekt ruleset is compiled against this same detekt 2.0 alpha.
detekt = "2.0.0-alpha.5"
composeRules = "0.6.2"


[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
androidx-compose-foundation-layout = { group = "androidx.compose.foundation", name = "foundation-layout" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
material-kolor = { group = "com.materialkolor", name = "material-kolor", version.ref = "materialKolor" }
# Consumed via detektPlugins(...). In detekt 2.0 the ktlint formatting rules moved from the old
# `detekt-formatting` artifact to `detekt-rules-ktlint-wrapper` under the new `dev.detekt` group.
detekt-ktlint-wrapper = { module = "dev.detekt:detekt-rules-ktlint-wrapper", version.ref = "detekt" }
compose-rules-detekt = { module = "io.nlopez.compose.rules:detekt", version.ref = "composeRules" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "baselineprofile" }
# detekt 2.0 renamed its Gradle plugin id from `io.gitlab.arturbosch.detekt` to `dev.detekt`.
detekt = { id = "dev.detekt", version.ref = "detekt" }

