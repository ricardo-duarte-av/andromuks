name: AV Andromuks

on:
  push:
    branches: [ main, develop, master ]
    tags: [ 'v*' ]
    # Don't burn CI on doc-only changes. NOTE: GitHub does not evaluate path filters for tag
    # pushes, so tagging a doc-only commit still cuts a full release — which is what we want.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# Keyed by commit SHA (not ref) so the branch-push run and the tag-push run for the same release
# commit share one group. Releasing means pushing master first, then the `vX.Y.Z` tag on the same
# commit; the tag run then cancels the now-redundant master run, so a release builds once (via the
# tag) instead of twice. Normal pushes each have a unique SHA and are unaffected.
concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: true

# Least privilege by default; the two jobs that publish assets opt into `contents: write`.
permissions:
  contents: read

# Sequential pipeline (each phase gates the next via `needs:`) so an early failure short-circuits the
# rest instead of wasting parallel cycles. Two paths, split on whether the ref is a `v*` tag:
#
#   push master  →  lint + test → base
#   tag v*       →  lint + test → base → play → release → variants
#                   verify-tag (runs alongside lint/test/base, gates the tag-only phases)
#
#   Phase 1  lint       — detekt + Android lint (hard gate; every push)
#   Phase 1  test       — JVM unit tests (hard gate; runs in parallel with lint)
#   Phase 1' verify-tag — tag-only: `vX.Y.Z` must match versionName in app/build.gradle.kts
#   Phase 2  base       — build base flavor (debug + release APKs + release AAB), nightly deploy
#   Phase 3  play       — tag-only: upload the base AAB to the Play Console internal track
#   Phase 4  release    — tag-only: cut a GitHub Release carrying the versioned APKs
#   Phase 5  variants   — tag-only: build the a/b/c flavors (release only), nightly deploy
jobs:
  # ---------------------------------------------------------------------------------------------
  # Phase 1 — Lint. Same detekt + Android lint gate as pr-check.yml. Secret-free. Gates everything.
  # ---------------------------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      # `detekt` is flavor-independent; Android lint is scoped to base debug to avoid the 4-flavor
      # fan-out. Identical to the pr-check.yml lint job. Baselines absorb existing debt so only NEW
      # findings fail.
      #
      # -PwarningsAsErrors=true makes any Kotlin compiler warning fail this job (see the
      # allWarningsAsErrors block in app/build.gradle.kts). The module is at zero warnings; this is
      # what keeps it there. It is CI-only on purpose — a deprecation from a Compose/AGP bump must
      # not make local builds unrunnable mid-upgrade.
      #
      # compileBaseDebugKotlin is named explicitly rather than left to lintBaseDebug's task graph:
      # lint does depend on it today, but the gate shouldn't silently stop applying if that changes.
      - name: Run detekt + Android lint (warnings are errors)
        run: ./gradlew detekt :app:compileBaseDebugKotlin :app:lintBaseDebug -PwarningsAsErrors=true --stacktrace --no-daemon --build-cache

      - name: Upload lint/detekt reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            **/build/reports/detekt/**
            app/build/reports/lint-results-*.*
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------
  # Phase 1 — JVM unit tests. Runs in parallel with lint and gates `base` alongside it.
  #
  # These used to exist but never ran here, so a red test could not fail the pipeline and the suite
  # was only as green as the last person to run it locally. Secret-free, and fast (no device, no
  # emulator — see GH issue #20 for the instrumentation side).
  #
  # Scoped to base debug for the same reason Android lint is: unit tests are per-variant, and the
  # 4-flavor fan-out would run identical tests eight times.
  # ---------------------------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :app:testBaseDebugUnitTest --stacktrace --no-daemon --build-cache

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------
  # Phase 1' — Tag sanity check. `versionCode` is time-derived (app/build.gradle.kts) so it's always
  # unique and monotonic — Play can never reject a duplicate. But `versionName` is bumped by hand,
  # and now that a tag means "release", a `v1.0.102` tag shipping an APK that reports 1.0.103 would
  # be a silent footgun. Runs in parallel with lint/base and fails the run in seconds.
  # ---------------------------------------------------------------------------------------------
  verify-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match versionName
        run: |
          set -euo pipefail
          want="${GITHUB_REF_NAME#v}"
          have=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "tag=$want  build.gradle.kts=$have"
          if [ "$want" != "$have" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $have in app/build.gradle.kts"
            exit 1
          fi

  # ---------------------------------------------------------------------------------------------
  # Phase 2 — Base flavor: debug + release APKs and the release AAB in one Gradle invocation (shared
  # compile + R8 outputs). Publishes nightly APK assets and hands the AAB to Phase 3 via an artifact.
  # Runs on every push (not just tags) so the rolling nightly channels stay current per-commit.
  # ---------------------------------------------------------------------------------------------
  base:
    needs: [ lint, test ]
    runs-on: ubuntu-latest
    # deploy-nightly pushes assets onto existing releases.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      # Release signing: decode the keystore from a base64 Secret; passwords come from Secrets via
      # env in the build step (app/build.gradle.kts reads KEYSTORE_*/KEY_* from the environment).
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/gomuks.keystore

      # Build the base APKs (debug + release) and the Play AAB together so compile + R8 outputs are
      # shared (no double compilation).
      - name: Build base flavor (debug + release APKs + release AAB)
        env:
          KEYSTORE_FILE: gomuks.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleBase bundleBaseRelease --stacktrace --no-daemon --parallel --build-cache

      # Resolve the actual APK paths instead of hardcoding the flavor/ABI/build-type filename order.
      - name: Locate built APKs
        run: |
          DEBUG_APK=$(find app/build/outputs/apk/base/debug -name "*.apk" | head -1)
          RELEASE_APK=$(find app/build/outputs/apk/base/release -name "*.apk" | head -1)
          echo "DEBUG_APK=$DEBUG_APK" >> $GITHUB_ENV
          echo "RELEASE_APK=$RELEASE_APK" >> $GITHUB_ENV
          echo "### Built APKs (base flavor)" >> $GITHUB_STEP_SUMMARY
          echo "- $DEBUG_APK" >> $GITHUB_STEP_SUMMARY
          echo "- $RELEASE_APK" >> $GITHUB_STEP_SUMMARY

      - name: Upload R8 missing rules
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: r8-missing-rules-base
          path: app/build/outputs/mapping/baseRelease/missing_rules.txt
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pt.aguiarvieira.andromuks-debug
          path: ${{ env.DEBUG_APK }}

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: pt.aguiarvieira.andromuks-release
          path: ${{ env.RELEASE_APK }}

      - name: Deploy Nightly Debug
        uses: WebFreak001/deploy-nightly@v3.1.0
        with:
          upload_url: https://uploads.github.com/repos/ricardo-duarte-av/andromuks/releases/248878640/assets{?name,label}
          release_id: 248878640
          asset_path: ${{ env.DEBUG_APK }}
          asset_name: andromuks.aguiarvieira.pt-debug-$$.apk
          asset_content_type: application/vnd.android.package-archive
          max_releases: 1

      - name: Deploy Nightly Release
        uses: WebFreak001/deploy-nightly@v3.1.0
        with:
          upload_url: https://uploads.github.com/repos/ricardo-duarte-av/andromuks/releases/249916670/assets{?name,label}
          release_id: 249916670
          asset_path: ${{ env.RELEASE_APK }}
          asset_name: andromuks.aguiarvieira.pt-release-$$.apk
          asset_content_type: application/vnd.android.package-archive
          max_releases: 1

      # Hand the signed AAB to Phase 3 (play) as a workflow artifact so the upload job doesn't have
      # to rebuild it.
      - name: Locate AAB
        run: echo "AAB_PATH=$(find app/build/outputs/bundle/baseRelease -name '*.aab' | head -1)" >> $GITHUB_ENV

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: pt.aguiarvieira.andromuks-release-aab
          path: ${{ env.AAB_PATH }}

  # ---------------------------------------------------------------------------------------------
  # Phase 3 — Publish the base AAB (built + signed in Phase 2) to the Play Console internal track.
  # No Gradle/JDK needed: just pull the artifact and upload.
  #
  # TAG-ONLY: "tag = release". Ordinary pushes to master build and nightly-deploy but never touch
  # the Play Console. Push a `vX.Y.Z` tag to ship.
  # ---------------------------------------------------------------------------------------------
  play:
    needs: [ base, verify-tag ]
    if: >
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: pt.aguiarvieira.andromuks-release-aab
          path: aab

      - name: Locate AAB
        run: echo "AAB_PATH=$(find aab -name '*.aab' | head -1)" >> $GITHUB_ENV

      # The SERVICE_ACCOUNT_JSON secret holds the Play service-account key base64-encoded (same
      # convention as KEYSTORE_BASE64), so decode it to a file. Feeding the base64 straight to
      # serviceAccountJsonPlainText made the action JSON.parse the base64 string; use the file input.
      - name: Decode Play service account
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: echo "$SERVICE_ACCOUNT_JSON" | base64 -d > service-account.json

      # r0adkll/upload-google-play handles the resumable upload with retries/timeouts internally.
      - name: Upload .aab to Internal Track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: service-account.json
          packageName: pt.aguiarvieira.andromuks
          releaseFiles: ${{ env.AAB_PATH }}
          track: internal
          # `completed` publishes the release live on the internal track (internal has no staged
          # rollout, so completed == available to internal testers immediately). `draft` would park
          # it in the Play Console for a manual publish.
          status: completed

  # ---------------------------------------------------------------------------------------------
  # Phase 4 — Cut a real GitHub Release for the tag, carrying the base debug + release APKs renamed
  # with the version. Reuses the artifacts Phase 2 already uploaded — no rebuild.
  #
  # This is additive: the pinned `deploy-nightly` releases below and in Phase 2 are untouched and
  # keep serving the rolling bleeding edge. Tagged releases are the permanent, versioned ones.
  #
  # TAG-ONLY.
  # ---------------------------------------------------------------------------------------------
  release:
    needs: play
    if: >
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Both artifacts land in the same directory so the rename loop below sees them together.
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: pt.aguiarvieira.andromuks-debug
          path: apks

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: pt.aguiarvieira.andromuks-release
          path: apks

      # ABI splits mean the APK filenames aren't fixed, so glob + classify rather than hardcode.
      - name: Rename APKs with version tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          for f in apks/*.apk; do
            case "$f" in
              *debug*) mv "$f" "apks/andromuks-${tag}-debug.apk" ;;
              *)       mv "$f" "apks/andromuks-${tag}-release.apk" ;;
            esac
          done
          ls -la apks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apks/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true

  # ---------------------------------------------------------------------------------------------
  # Phase 5 — Side-by-side variants a/b/c. Release only (no debug builds/deploys for these). One job
  # per flavor via the matrix; independent (fail-fast: false) so one variant's failure doesn't sink
  # the others.
  #
  # TAG-ONLY: the a/b/c nightly channels now refresh on tagged releases rather than on every push.
  # ---------------------------------------------------------------------------------------------
  variants:
    needs: release
    if: >
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # deploy-nightly pushes assets onto existing releases.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: a
            gradleFlavor: A
            tag: '-A'
            id_release: 281695559
          - flavor: b
            gradleFlavor: B
            tag: '-B'
            id_release: 281696024
          - flavor: c
            gradleFlavor: C
            tag: '-C'
            id_release: 281696449

    steps:
      - uses: actions/checkout@v4

      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/gomuks.keystore

      # Release only for the variants — no debug APK is needed here.
      - name: Build ${{ matrix.flavor }} flavor (release APK)
        env:
          KEYSTORE_FILE: gomuks.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assemble${{ matrix.gradleFlavor }}Release --stacktrace --no-daemon --parallel --build-cache

      - name: Locate built APK
        run: |
          RELEASE_APK=$(find app/build/outputs/apk/${{ matrix.flavor }}/release -name "*.apk" | head -1)
          echo "RELEASE_APK=$RELEASE_APK" >> $GITHUB_ENV
          echo "### Built APK (${{ matrix.flavor }} flavor, release)" >> $GITHUB_STEP_SUMMARY
          echo "- $RELEASE_APK" >> $GITHUB_STEP_SUMMARY

      - name: Upload R8 missing rules
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: r8-missing-rules-${{ matrix.flavor }}
          path: app/build/outputs/mapping/${{ matrix.flavor }}Release/missing_rules.txt
          if-no-files-found: ignore

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: pt.aguiarvieira.andromuks${{ matrix.tag }}-release
          path: ${{ env.RELEASE_APK }}

      - name: Deploy Nightly Release
        uses: WebFreak001/deploy-nightly@v3.1.0
        with:
          upload_url: https://uploads.github.com/repos/ricardo-duarte-av/andromuks/releases/${{ matrix.id_release }}/assets{?name,label}
          release_id: ${{ matrix.id_release }}
          asset_path: ${{ env.RELEASE_APK }}
          asset_name: andromuks.aguiarvieira.pt-release${{ matrix.tag }}-$$.apk
          asset_content_type: application/vnd.android.package-archive
          max_releases: 1
